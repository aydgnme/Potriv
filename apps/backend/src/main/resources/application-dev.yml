spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/potriv
    username: potriv
    password: potriv
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025

potriv:
  dev:
    # `ddl-auto: update` never refreshes an existing enum CHECK constraint, so a
    # local database created by older code silently rejects new enum values.
    # Fail fast at startup with an actionable message instead of surfacing it as
    # a confusing error on the first audited write.
    schema-drift:
      enabled: true
      fail-fast: true
