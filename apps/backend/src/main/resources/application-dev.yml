spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/potriv
    username: potriv
    password: potriv
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Hibernate's show-sql writes straight to System.out: no timestamp, no level,
    # no request id, and logback cannot format or colour it. In a normal dev run
    # it produced more output than every real log line combined. SQL diagnostics
    # are still one property away, but they go *through* the logging system:
    #
    #   ./mvnw spring-boot:run \
    #     -Dspring-boot.run.jvmArguments="-Dlogging.level.org.hibernate.SQL=DEBUG"
    #
    # See docs/backend/logging.md.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025

potriv:
  dev:
    # `ddl-auto: update` never refreshes an existing enum CHECK constraint, so a
    # local database created by older code silently rejects new enum values.
    # Fail fast at startup with an actionable message instead of surfacing it as
    # a confusing error on the first audited write.
    schema-drift:
      enabled: true
      fail-fast: true
