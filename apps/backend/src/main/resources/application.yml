spring:
  application:
    name: potriv-backend

  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

app:
  # Where the product frontend is served, and therefore the base of every link
  # this backend emails out: `/invite?token=…` and `/reset-password?token=…`.
  #
  # This was http://localhost:5173, an origin no application in this repository
  # serves — `apps/` contains only `backend` and the Next frontend, which runs
  # on 3000. Reset links were therefore dead in development, and invite links
  # had no destination at all until the Next `/invite` route was added.
  #
  # Overridable so a differently-hosted frontend does not need a code change;
  # the prod profile supplies its own default.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  api-url: http://localhost:8080/api
  jwt:
    issuer: http://localhost:8080/api
    secret: change-this-secret-in-production-change-this-secret
    access-token-minutes: 15
    refresh-token-days: 7
  auth:
    password-reset-token-minutes: 30
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
  mail:
    from: no-reply@potriv.local

potriv:
  # Embedded read-only administration console (/api/admin/**). Disabled by
  # default; when enabled, it is protected by a SYSTEM_ADMIN browser-session
  # login backed by the system-admin identity below.
  backend-console:
    enabled: ${BACKEND_CONSOLE_ENABLED:false}
  # Bootstrap system administrator. Reconciled on every start: changing these
  # values rotates the account's password/name and reactivates it, so the
  # configuration stays the source of truth (see SystemAdminSeeder).
  system-admin:
    email: ${SYSTEM_ADMIN_EMAIL:admin@aydgn.me}
    password: ${SYSTEM_ADMIN_PASSWORD:ChangeMe123!}
    name: ${SYSTEM_ADMIN_NAME:Potriv System Admin}

  dev:
    # Development-only diagnostic for stale enum CHECK constraints left behind by
    # Hibernate `ddl-auto: update`. Off by default; application-dev.yml opts in.
    # Production schema is owned by Flyway and must never depend on this.
    schema-drift:
      enabled: false
      fail-fast: false

cors:
  # Local frontend dev servers (Vite and the Next.js control console).
  # Production overrides this with env-driven explicit origins.
  allowed-origins: http://localhost:5173,http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
