spring:
  application:
    name: potriv-backend

  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

app:
  # Where the product frontend is served, and therefore the base of every link
  # this backend emails out: `/invite#token=…` and `/reset-password#token=…`.
  # The token is in the fragment, which browsers never send to a server.
  #
  # This was http://localhost:5173, an origin no application in this repository
  # serves — `apps/` contains only `backend` and the Next frontend, which runs
  # on 3000. Reset links were therefore dead in development, and invite links
  # had no destination at all until the Next `/invite` route was added.
  #
  # Overridable so a differently-hosted frontend does not need a code change;
  # the prod profile supplies its own default.
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  api-url: http://localhost:8080/api
  jwt:
    issuer: http://localhost:8080/api
    secret: change-this-secret-in-production-change-this-secret
    access-token-minutes: 15
    refresh-token-days: 7
  auth:
    password-reset-token-minutes: 30
    # 72 hours. Long enough to reach somebody across a weekend, short enough
    # that a link found later in a mailbox or a proxy log is already dead.
    invite-token-hours: ${INVITE_TOKEN_HOURS:72}
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
  mail:
    from: no-reply@potriv.local

  # Shared, database-backed rate limiting. See RateLimitService and the
  # migration V10__rate_limiting.sql for what "database-backed" costs and why
  # it is the interim store rather than a dedicated one.
  #
  # Every window/limit pair below is independently overridable, because there
  # is no value here that is obviously correct for every deployment — it
  # depends on how large a legitimate onboarding burst looks for a given
  # customer base. Durations accept the same suffixed form Spring already
  # parses elsewhere (`60s`, `24h`, `5m`).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # false = fail closed: if the store itself errors, deny the request rather
    # than silently letting every quota through on every instance at once.
    # See RateLimitProperties#failOpen for the reasoning.
    fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
    # A placeholder, exactly like app.jwt.secret above: fine for a local
    # database only you can reach, refused in the prod profile by
    # ProductionConfigGuard if left unchanged.
    hmac-secret: ${RATE_LIMIT_HMAC_SECRET:change-this-secret-in-production-change-this-secret}
    # Empty: no X-Forwarded-For is trusted unless explicitly configured. See
    # ClientIpResolver.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    # See application-prod.yml: ProductionConfigGuard requires one of
    # trusted-proxies or this to be set whenever rate limiting is enabled in
    # the prod profile. Not enforced outside prod.
    no-reverse-proxy: ${RATE_LIMIT_NO_REVERSE_PROXY:false}
    invite:
      short-window: ${RATE_LIMIT_INVITE_ORG_SHORT_WINDOW:60s}
      short-limit: ${RATE_LIMIT_INVITE_ORG_SHORT_LIMIT:20}
      daily-window: ${RATE_LIMIT_INVITE_ORG_DAILY_WINDOW:24h}
      daily-limit: ${RATE_LIMIT_INVITE_ORG_DAILY_LIMIT:200}
      actor-window: ${RATE_LIMIT_INVITE_ACTOR_WINDOW:60s}
      actor-limit: ${RATE_LIMIT_INVITE_ACTOR_LIMIT:10}
      # How soon the same address may be re-invited. Not "per organization":
      # one inbox, one cooldown, whichever admin or organization is inviting it.
      recipient-cooldown: ${RATE_LIMIT_INVITE_RECIPIENT_COOLDOWN:5m}
    register:
      ip-window: ${RATE_LIMIT_REGISTER_IP_WINDOW:60s}
      ip-limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:5}
      identity-window: ${RATE_LIMIT_REGISTER_IDENTITY_WINDOW:1h}
      identity-limit: ${RATE_LIMIT_REGISTER_IDENTITY_LIMIT:3}
    password-reset:
      ip-window: ${RATE_LIMIT_PASSWORD_RESET_IP_WINDOW:60s}
      ip-limit: ${RATE_LIMIT_PASSWORD_RESET_IP_LIMIT:10}
      identity-window: ${RATE_LIMIT_PASSWORD_RESET_IDENTITY_WINDOW:15m}
      identity-limit: ${RATE_LIMIT_PASSWORD_RESET_IDENTITY_LIMIT:3}
    login:
      # IP only. Never account-scoped — see RateLimitService#checkLogin.
      ip-window: ${RATE_LIMIT_LOGIN_IP_WINDOW:60s}
      ip-limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:15}
    # How often expired rows are purged from rate_limit_windows and
    # rate_limit_cooldowns. See RateLimitCleanupJob.
    cleanup-interval-ms: ${RATE_LIMIT_CLEANUP_INTERVAL_MS:3600000}

potriv:
  # Embedded read-only administration console (/api/admin/**). Disabled by
  # default; when enabled, it is protected by a SYSTEM_ADMIN browser-session
  # login backed by the system-admin identity below.
  backend-console:
    enabled: ${BACKEND_CONSOLE_ENABLED:false}
  # Bootstrap system administrator. Reconciled on every start: changing these
  # values rotates the account's password/name and reactivates it, so the
  # configuration stays the source of truth (see SystemAdminSeeder).
  system-admin:
    email: ${SYSTEM_ADMIN_EMAIL:admin@aydgn.me}
    password: ${SYSTEM_ADMIN_PASSWORD:ChangeMe123!}
    name: ${SYSTEM_ADMIN_NAME:Potriv System Admin}

  dev:
    # Development-only diagnostic for stale enum CHECK constraints left behind by
    # Hibernate `ddl-auto: update`. Off by default; application-dev.yml opts in.
    # Production schema is owned by Flyway and must never depend on this.
    schema-drift:
      enabled: false
      fail-fast: false

cors:
  # Local frontend dev servers (Vite and the Next.js control console).
  # Production overrides this with env-driven explicit origins.
  allowed-origins: http://localhost:5173,http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
