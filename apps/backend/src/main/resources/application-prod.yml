spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is managed by Flyway only; Hibernate must never mutate it.
      # ProductionConfigGuard refuses create/create-drop/update at boot.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # Refuse to fall back to plaintext. Submission credentials must never
            # cross the wire unencrypted, even if the server stops advertising
            # STARTTLS.
            required: true
          # The reset mail is sent synchronously inside the request thread, and
          # JavaMail's defaults are *unbounded*: a hung SMTP server would hold an
          # HTTP thread forever and exhaust the pool. These caps bound the worst
          # case to a few seconds; the send then fails, is caught, and the
          # anti-enumeration response is unchanged.
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          # Certificate validation stays on. Never set mail.smtp.ssl.trust here.

app:
  frontend-url: ${FRONTEND_URL:https://potriv.aydgn.me}
  api-url: ${APP_BASE_URL:https://api.potriv.aydgn.me/api}
  jwt:
    issuer: ${JWT_ISSUER:https://api.potriv.aydgn.me/api}
    # No default on purpose: production must fail fast without a real secret.
    secret: ${JWT_SECRET}
    access-token-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  mail:
    from: ${MAIL_FROM}

cors:
  # Comma-separated list of exact origins. Wildcards are refused at boot
  # because CORS responses carry credentials.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://potriv.aydgn.me}

# OpenAPI/Swagger stays off in production unless explicitly re-enabled.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoint:
    health:
      group:
        # What the container/orchestrator probe asks: can *this instance* serve
        # requests? That depends on the database, not on an external SMTP server.
        # Outbound mail still appears in the full /actuator/health aggregate, so
        # its state stays visible without taking a serving instance out of
        # rotation whenever the mail provider blips.
        readiness:
          include: db, ping
  endpoints:
    web:
      exposure:
        # Production exposes the health probe only.
        include: health
