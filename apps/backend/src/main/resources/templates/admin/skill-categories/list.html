<!DOCTYPE html>
<html th:replace="~{admin/layout/base :: page(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="admin-page-head">
        <h1>Skill categories</h1>
        <div class="admin-page-actions">
            <a class="admin-btn" th:href="@{/admin/skill-categories/new}">Add category</a>
        </div>
    </div>
    <div th:replace="~{admin/fragments/filters :: search('/admin/skill-categories', ${list.query}, 'Search name…')}"></div>

    <div th:if="${list.items.isEmpty()}">
        <div th:replace="~{admin/fragments/empty-state :: empty('No skill categories found.')}"></div>
    </div>

    <div class="admin-table-scroll">
        <table th:unless="${list.items.isEmpty()}" class="admin-table">
            <thead>
            <tr><th>Name</th><th>Organization</th><th>Status</th>
                <th class="num">Skills</th><th>Created</th></tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${list.items}">
                <td><a th:href="@{'/admin/skill-categories/' + ${cat.id}}" th:text="${cat.name}">Cat</a></td>
                <td th:text="${cat.organizationName}">Org</td>
                <td><span th:replace="~{admin/fragments/badges :: badge(${cat.active} ? 'Active' : 'Inactive')}"></span></td>
                <td class="num" th:text="${cat.skillCount}">0</td>
                <td th:text="${@adminFormat.dateTime(cat.createdAt)}">date</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{admin/fragments/pagination :: pagination(${list})}"></div>
</div>
</body>
</html>
