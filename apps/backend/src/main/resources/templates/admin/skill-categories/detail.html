<!DOCTYPE html>
<html th:replace="~{admin/layout/base :: page(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="admin-page-head">
        <h1 th:text="${category.name}">Category</h1>
        <div class="admin-page-actions">
            <a class="admin-btn admin-btn--ghost"
               th:href="@{'/admin/skill-categories/' + ${category.id} + '/edit'}">Edit</a>
        </div>
    </div>

    <section class="admin-card">
        <h2 class="admin-card-title">General</h2>
        <dl class="admin-dl">
            <dt>Name</dt><dd th:text="${category.name}">Name</dd>
            <dt>Organization</dt>
            <dd><a th:href="@{'/admin/organizations/' + ${category.organizationId}}"
                   th:text="${category.organizationName}">Org</a></dd>
            <dt>Status</dt>
            <dd><span th:replace="~{admin/fragments/badges :: badge(${category.active} ? 'Active' : 'Inactive')}"></span></dd>
            <dt>Skills</dt>
            <dd>
                <span class="mono" th:text="${category.skillCount}">0</span>
                <a class="admin-inline-link"
                   th:href="@{/admin/skills(category=${category.id})}">Browse skills</a>
            </dd>
        </dl>
    </section>

    <section class="admin-card">
        <h2 class="admin-card-title">Metadata</h2>
        <dl class="admin-dl">
            <dt>ID</dt><dd><code th:text="${category.id}">uuid</code></dd>
            <dt>Created</dt><dd th:text="${@adminFormat.dateTime(category.createdAt)}">date</dd>
            <dt>Updated</dt><dd th:text="${@adminFormat.dateTime(category.updatedAt)}">date</dd>
        </dl>
    </section>
</div>
</body>
</html>
