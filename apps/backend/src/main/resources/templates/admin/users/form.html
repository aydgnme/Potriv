<!DOCTYPE html>
<html th:replace="~{admin/layout/base :: page(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="admin-page-head">
        <h1>Edit user</h1>
        <p class="admin-page-sub" th:text="${user.email}">email</p>
    </div>

    <section class="admin-card admin-card--form">
        <form method="post" novalidate th:object="${form}"
              th:action="@{'/admin/users/' + ${user.id} + '/edit'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="admin-form-errors" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
            </div>

            <div class="admin-form-field">
                <label>Email</label>
                <p class="admin-form-static" th:text="${user.email}">email</p>
            </div>

            <div class="admin-form-field">
                <label for="name">Display name</label>
                <input id="name" type="text" th:field="*{name}" maxlength="120"
                       autocomplete="off" autofocus
                       th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <p class="admin-field-error" th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">Name error</p>
                <p class="admin-field-hint">Only the display name can be edited here. Email,
                    organization, roles, and status are managed separately.</p>
            </div>

            <div class="admin-form-actions">
                <button type="submit" class="admin-btn">Save changes</button>
                <a class="admin-btn admin-btn--ghost"
                   th:href="@{'/admin/users/' + ${user.id}}">Cancel</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
