name: Frontend CI

# The same gates the frontend has always been verified against locally, run from
# a clean runner on every change that can reach main. Before this workflow, "the
# suite passes" meant "on one machine, if somebody remembered to run it".
#
# There is deliberately no `paths:` filter, matching Backend CI: a path-filtered
# workflow reports no status at all on a PR that misses the filter, which would
# permanently block every such PR once this is a required check.
on:
  # `v2` is the V2 integration branch. Every V2 slice is reviewed into it and
  # never into `main`, so a workflow that only watched `main` would let an
  # entire redesign programme merge without ever running.
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]
  workflow_dispatch:

# Read-only token: this workflow builds and inspects, and needs nothing else.
permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: frontend-verify
    runs-on: ubuntu-latest
    # The whole suite plus a production build finishes in a few minutes; twenty
    # is a stuck-run ceiling rather than a target.
    timeout-minutes: 20

    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # The frontend keeps its own lockfile; there is no root workspace, and
          # inventing one for CI would change how everybody installs locally.
          cache-dependency-path: apps/frontend/package-lock.json

      # `ci`, never `install`: the lockfile is the contract, and a CI run that
      # quietly resolves different versions is not verifying the same tree.
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # Runs before the other gates because a known-vulnerable dependency is a
      # reason to stop, not something worth spending a build on first.
      #
      # `high` rather than `critical`: the tree is at zero across every severity
      # as of the Next 16 migration, so the stricter threshold costs nothing
      # today and is the one that would have caught what SEC-01 had to clean up
      # by hand. Advisories are published against existing releases, so this can
      # go red without anybody changing a line — that is the point, and the fix
      # is to upgrade the dependency rather than to lower this number.
      - name: Audit high-severity dependencies
        working-directory: apps/frontend
        run: npm audit --audit-level=high

      # Separate steps so a failure names itself in the checks UI rather than
      # surfacing as one opaque red script.
      - name: Typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Test
        working-directory: apps/frontend
        run: npm test

      - name: Build
        working-directory: apps/frontend
        run: npm run build
