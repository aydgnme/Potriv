name: Backend CI

# The backend safety net runs on every change that can reach main, plus on
# demand. There is deliberately no `paths:` filter: a path-filtered workflow
# never reports a status on PRs that miss the filter, which would permanently
# block any PR once "Backend CI / backend-verify" is a required check.
on:
  # `v2` is the V2 integration branch. Every V2 slice is reviewed into it and
  # never into `main`, so a workflow that only watched `main` would let an
  # entire redesign programme merge without ever running.
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]
  workflow_dispatch:

# Read-only token: this workflow only builds and inspects the repository.
permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Java 21 is the project's target (pom.xml <java.version>21</java.version>).
      # Pinning it here also keeps logs clean: newer local JDKs make JaCoCo emit
      # "Unsupported class file major version" noise that hides real failures.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Safety net in case the executable bit is ever lost in a checkout.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
        working-directory: apps/backend

      # The same gate we trust locally. The integration tests run against real
      # PostgreSQL through Testcontainers, which works because GitHub-hosted
      # Ubuntu runners ship a working Docker daemon — the suite is never
      # downgraded to mocks or an in-memory database.
      - name: Verify backend
        run: ./mvnw -B clean verify
        working-directory: apps/backend

  production-compose-config:
    name: production-compose-config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Catches broken compose syntax or environment wiring before a deploy.
      # .env.prod.example holds placeholder values only, so no secrets are
      # needed to resolve the file.
      - name: Validate production compose configuration
        run: >
          docker compose --env-file .env.prod.example
          -f docker-compose.prod.yml config --quiet
