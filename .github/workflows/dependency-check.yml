name: Dependency Check

# Software composition analysis (known-CVE scan) for the backend's dependency
# tree. Deliberately NOT on pull requests: OWASP Dependency-Check has to sync the
# National Vulnerability Database, and without an API key that first sync takes
# hours (measured locally: ~2.5h for 372k records) — running it per-PR would also
# mean handing NVD_API_KEY to a workflow that can be triggered by a fork's
# pull_request event, which this repository does not do for any secret-bearing
# job. Keeping it scheduled means PR feedback stays fast, no fork ever sees this
# secret, and CVE coverage still runs regularly.
#
# The one thing this workflow must never do again is finish green having
# scanned nothing: previously, a missing NVD_API_KEY made the guard step below
# print a warning and every following step quietly no-op, so the job — and the
# check GitHub reports — succeeded regardless of whether anything was scanned.
# It now fails outright whenever the key is absent, so a red run in this
# workflow always means "look at this," never "somebody forgot a secret and
# nobody noticed."
#
# Required secret setup (repository owner, one time — this workflow does not
# and must not create the secret itself):
#   1. Request a free NVD API key: https://nvd.nist.gov/developers/request-an-api-key
#   2. Repository Settings -> Secrets and variables -> Actions -> New
#      repository secret, name NVD_API_KEY, value the key from step 1.
#
# ---------------------------------------------------------------- Coverage
#
# Not every workspace's software-composition-analysis gate lives in this
# file, so the current state is recorded here in one place rather than left
# to be reconstructed from five different workflow files:
#
#   apps/backend          OWASP Dependency-Check, this workflow (Java/Maven).
#   apps/frontend          `npm audit --audit-level=high`, required, in
#                          frontend-ci.yml — runs on every PR, always fail-
#                          closed, no NVD-style key or sync dependency.
#   tools/api-e2e          `npm audit --audit-level=high`, required, in
#                          api-e2e.yml, added alongside this change — this
#                          workspace previously had no dependency audit step
#                          at all.
#   Container image / SBOM  Not implemented yet. Image build, SBOM
#                          generation, and image vulnerability scanning are
#                          scoped to the Azure staging CI/CD pipeline (a
#                          later, separate piece of work) — apps/backend/
#                          Dockerfile exists but nothing here scans the image
#                          it produces. An explicit, tracked gap, not a
#                          silent omission.
on:
  schedule:
    # Weekly, Monday 04:17 UTC — after CodeQL, off the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check
  cancel-in-progress: false

jobs:
  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Mapped to an env var so the guard below can test it: the `secrets`
      # context is not available in step-level `if:` conditions.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # Pinned for reproducibility; matches the version verified locally.
      DEPENDENCY_CHECK_VERSION: 12.2.2
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Fails the job outright without a key, rather than warning and
      # continuing: a scheduled workflow that "succeeds" without scanning
      # anything is a false all-clear nobody has a reason to go looking
      # behind, which is worse than an honestly red check. The message names
      # only the missing variable, never a secret value or network detail.
      - name: Require NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error title=Dependency-Check cannot run::NVD_API_KEY secret is not configured. \
            Without it the NVD sync is anonymous and rate-limited to hours, so this job refuses to \
            pretend to scan. Add the secret (free key: https://nvd.nist.gov/developers/request-an-api-key) \
            and re-run this workflow."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The NVD dataset is expensive to build and changes slowly, so it is
      # cached across runs and refreshed incrementally. A corrupted or
      # partial cache cannot produce a silent false green: dependency-check-
      # maven itself fails the build when it cannot update from the cache it
      # restored, and the report-verification step below refuses to trust
      # this step's exit code alone, so a broken cache surfaces as a red run
      # rather than a stale scan.
      - name: Cache NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ env.DEPENDENCY_CHECK_VERSION }}-

      # failBuildOnCVSS=9 keeps the gate meaningful at first: only critical
      # findings break the build, so noisy medium/low CVEs cannot make the
      # workflow useless. Lower it deliberately once the backlog is
      # understood. suppressionFiles points at a real, version-controlled
      # file (apps/backend/dependency-check-suppressions.xml) so any future
      # suppression is reviewable in a diff and — via that file's required
      # `until` dates — expires back into an active finding on its own
      # rather than staying silenced indefinitely.
      - name: Run OWASP Dependency-Check
        working-directory: apps/backend
        run: >
          ./mvnw -B
          "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check"
          -DnvdApiKey="$NVD_API_KEY"
          -Dformats=HTML,JSON
          -DfailBuildOnCVSS=9
          -DskipProvidedScope=true
          -DsuppressionFiles=dependency-check-suppressions.xml

      # A defence against exactly the class of bug this workflow used to
      # have: the Maven goal above can — through a plugin update, a changed
      # default, or a cache/environment quirk this workflow does not control
      # — exit 0 without having written a real report. This step trusts
      # nothing but the report's own presence and non-triviality.
      - name: Verify a real report was produced
        working-directory: apps/backend
        run: |
          report="target/dependency-check-report.json"
          if [ ! -s "$report" ]; then
            echo "::error title=Dependency-Check produced no report::Expected $report to exist \
            and be non-empty after a scan. Treating this as a failed run rather than trusting the \
            Maven goal's own exit code alone."
            exit 1
          fi
          dependencies=$(jq '.dependencies | length' "$report")
          if [ "$dependencies" -lt 1 ]; then
            echo "::error title=Dependency-Check report is empty::The report exists but lists zero \
            scanned dependencies, which for this project's dependency tree means the scan did not \
            actually run against real data."
            exit 1
          fi
          echo "Scanned $dependencies dependencies."

      # Reports are the point of the run, so upload them even when an earlier
      # step failed. They are artifacts only — never committed.
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: apps/backend/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30
