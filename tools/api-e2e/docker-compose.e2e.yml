# Isolated services for the API E2E run. Own project name, own ports, own
# volumes — nothing here touches a developer's normal Potriv stack.
#
#   docker compose -p potriv-api-e2e -f docker-compose.e2e.yml up -d
services:
  e2e-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: potriv_e2e
      POSTGRES_USER: potriv_e2e
      # Generated per run by the runner; never a committed value.
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?E2E_DB_PASSWORD is generated by the runner}
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-55432}:5432"
    tmpfs:
      # The database is disposable by construction: nothing survives the run.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potriv_e2e -d potriv_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e-mail:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    ports:
      - "127.0.0.1:${E2E_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${E2E_MAIL_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
