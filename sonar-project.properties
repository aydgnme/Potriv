# SonarCloud / SonarQube scanner configuration.
#
# This file is inert for local development: nothing in `./mvnw verify` reads it,
# and no analysis runs without a SONAR_TOKEN supplied by CI. Never put a token
# in this file.
#
# !! projectKey and organization below are the conventional SonarCloud defaults
# !! for a GitHub-imported project. They have NOT been verified against a real
# !! SonarCloud organization yet — confirm both before the first scan.
# !! See docs/backend/security-baseline.md §6.
sonar.projectKey=aydgnme_Potriv
sonar.organization=aydgnme
sonar.projectName=Potriv

# The backend is the only analyzed module today; the frontend is out of scope.
sonar.sources=apps/backend/src/main/java
sonar.tests=apps/backend/src/test/java
sonar.java.binaries=apps/backend/target/classes

# Produced by `./mvnw verify` (JaCoCo). Analysis must therefore run after verify.
sonar.coverage.jacoco.xmlReportPaths=apps/backend/target/site/jacoco/jacoco.xml

sonar.sourceEncoding=UTF-8
